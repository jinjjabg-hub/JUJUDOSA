name: Build TWA APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '앱 버전 (예: 1.0.1)'
        required: false
        default: '1.0.0'
      version_code:
        description: '버전 코드 (정수, 업로드마다 증가)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.27.0

      - name: Install Android SDK command-line tools
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          cp -r /tmp/cmdtools/cmdline-tools/* "$SDK"/
          yes | "$SDK/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Restore keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing KEYSTORE_PASSWORD repository secret"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > twa/android.keystore
          test -s twa/android.keystore

      - name: Patch app version
        env:
          VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
          VERSION_CODE: ${{ github.event.inputs.version_code || github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          [[ "$VERSION_NAME" =~ ^[0-9A-Za-z._+-]+$ ]] || { echo "::error::Invalid version name"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] && (( VERSION_CODE > 0 && VERSION_CODE <= 2100000000 )) || { echo "::error::Invalid version code"; exit 1; }
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('twa/twa-manifest.json','utf8'));
            m.appVersionName = process.env.VERSION_NAME;
            m.appVersionCode = parseInt(process.env.VERSION_CODE, 10);
            delete m.signingKey.password;
            delete m.signingKey.keypassword;
            fs.writeFileSync('twa/twa-manifest.json', JSON.stringify(m, null, 2));
            console.log('Manifest patched:', m.appVersionName, '#' + m.appVersionCode);
          "
          echo "APP_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Generate Android project
        working-directory: twa
        run: bubblewrap update --skipVersionUpgrade

      - name: Bubblewrap build
        working-directory: twa
        run: bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}

      - name: Verify and rename artifacts
        run: |
          test -s twa/app-release-signed.apk
          test -s twa/app-release-bundle.aab
          cp twa/app-release-signed.apk "jujudosa-v${APP_VERSION}.apk"
          cp twa/app-release-bundle.aab "jujudosa-v${APP_VERSION}.aab"

      - name: Upload APK and AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: jujudosa-${{ env.APP_VERSION }}-${{ github.run_number }}
          path: |
            jujudosa-*.apk
            jujudosa-*.aab
          if-no-files-found: error

      - name: Create GitHub Release (태그 빌드 시)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jujudosa-*.apk
            jujudosa-*.aab
          generate_release_notes: true
